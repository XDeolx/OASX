name: Testoyj Windows Build

on:
  push:
    branches:
      - testoyj
    tags:
      - "testoyj-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.1"
  DART_VERSION: "3.9.0"

jobs:
  build_windows:
    name: Analyze, test and build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: pwsh
        run: |
          $flutterOutput = ((flutter --version) | Out-String).Trim()
          $flutterOutput
          if ($flutterOutput -notmatch "Flutter $env:FLUTTER_VERSION") {
            throw "Expected Flutter $env:FLUTTER_VERSION"
          }

          $dartOutput = ((dart --version 2>&1) | Out-String).Trim()
          $dartOutput
          if ($dartOutput -notmatch "Dart SDK version: $env:DART_VERSION") {
            throw "Expected Dart $env:DART_VERSION"
          }

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze source
        shell: pwsh
        run: |
          $analyzeOutput = & flutter analyze --no-pub 2>&1
          $analyzeExitCode = $LASTEXITCODE
          $analyzeOutput | Write-Output
          if ($analyzeExitCode -ne 0) {
            $annotation = ($analyzeOutput | Select-Object -Last 80 | Out-String)
            $annotation = $annotation.Replace('%', '%25')
            $annotation = $annotation.Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=analysis_options.yaml,line=1::$annotation"
            exit $analyzeExitCode
          }

      - name: Run tests
        shell: pwsh
        run: |
          $testOutput = & flutter test --no-pub 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Write-Output
          if ($testExitCode -ne 0) {
            $failureIndex = -1
            for ($index = 0; $index -lt $testOutput.Count; $index++) {
              if ($testOutput[$index] -match 'EXCEPTION CAUGHT|TestFailure|Expected:|Some tests failed') {
                $failureIndex = $index
                break
              }
            }
            if ($failureIndex -ge 0) {
              $failureEnd = [Math]::Min($failureIndex + 60, $testOutput.Count - 1)
              $annotation = ($testOutput[$failureIndex..$failureEnd] | Out-String)
            } else {
              $annotation = ($testOutput | Select-Object -Last 40 | Out-String)
            }
            $annotation = $annotation.Replace('%', '%25')
            $annotation = $annotation.Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=test,line=1::$annotation"
            exit $testExitCode
          }

      - name: Build Windows app
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and
              $env:GITHUB_REF_NAME -match '^testoyj-v(\d+\.\d+\.\d+)\.(\d+)$') {
            flutter build windows --release `
              --build-name $Matches[1] `
              --build-number $Matches[2]
          } else {
            flutter build windows --release
          }

      - name: Package Windows build
        id: package
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          if (!(Test-Path $releasePath)) {
            throw "Windows release directory not found"
          }
          $versionLabel = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            'testoyj'
          }
          $assetName = "oasx_${versionLabel}_windows.zip"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          Compress-Archive `
            -Path (Join-Path $releasePath '*') `
            -DestinationPath $assetPath `
            -Force
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create testoyj GitHub Release
        if: startsWith(github.ref, 'refs/tags/testoyj-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^testoyj-v', ''
          $changelog = Get-Content -LiteralPath TESTOYJ_CHANGELOG.md
          $sectionStart = -1
          $sectionEnd = $changelog.Count
          for ($index = 0; $index -lt $changelog.Count; $index++) {
            if ($changelog[$index] -match '^## \d{4}-\d{2}-\d{2}$') {
              if ($sectionStart -lt 0) {
                $sectionStart = $index
              } else {
                $sectionEnd = $index
                break
              }
            }
          }
          if ($sectionStart -lt 0) {
            throw 'No dated release section found in TESTOYJ_CHANGELOG.md'
          }
          $notes = @(
            "# OASX testoyj v$version"
            ''
          ) + $changelog[$sectionStart..($sectionEnd - 1)] + @(
            ''
            '[查看完整更新日志](https://github.com/XDeolx/OASX/blob/testoyj/TESTOYJ_CHANGELOG.md)'
          )
          $notesPath = Join-Path $env:RUNNER_TEMP 'testoyj_release_notes.md'
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release create $env:GITHUB_REF_NAME `
            '${{ steps.package.outputs.asset_path }}' `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "OASX testoyj v$version" `
            --notes-file $notesPath
